config:
  version-candidate: VERSION
  dependencies:
    dependencies: [build]

build:
  correctness:
    build:
      image: vaticle-ubuntu-20.04
      command: |
        sudo ln -s /usr/bin/python3 /usr/bin/python
        git submodule update --init --recursive
        pushd pages && bash symlink_creator.sh && bundle install && popd
        bazel build //... --spawn_strategy=local
    deploy-artifact-snapshot:
      image: vaticle-ubuntu-20.04
      command: |
        git submodule update --init --recursive
        pushd pages && bash symlink_creator.sh && bundle install && popd
        sudo ln -s /usr/bin/python3 /usr/bin/python
        export DEPLOY_ARTIFACT_USERNAME=$REPO_VATICLE_USERNAME
        export DEPLOY_ARTIFACT_PASSWORD=$REPO_VATICLE_PASSWORD
        bazel run --define version=0.0.0-$(git rev-parse HEAD) //:deploy-web-docs-dev --spawn_strategy=local -- snapshot
    deploy-nomad-staging:
      image: vaticle-ubuntu-20.04
      dependencies: [deploy-artifact-snapshot]
      command: |
        echo $NOMAD_CACERT_BASE64 | base64 -d > /tmp/nomad-ca.pem
        export NOMAD_CACERT=/tmp/nomad-ca.pem
        VERSION=0.0.0-$(git rev-parse HEAD) COMMIT=$(git rev-parse HEAD) envsubst <infrastructure/web-docs-staging.nomad | nomad job run -

release:
  deployment:
    deploy-artifact-release:
      image: vaticle-ubuntu-20.04
      command: |
        git submodule update --init --recursive
        pushd pages && bash symlink_creator.sh && bundle install && popd
        sudo ln -s /usr/bin/python3 /usr/bin/python
        export DEPLOY_ARTIFACT_USERNAME=$REPO_VATICLE_USERNAME
        export DEPLOY_ARTIFACT_PASSWORD=$REPO_VATICLE_PASSWORD
        bazel run --define version=$(cat VERSION) //:deploy-web-docs --spawn_strategy=local -- release
    deploy-nomad-production:
      image: vaticle-ubuntu-20.04
      dependencies: [deploy-artifact-release]
      command: |
        echo $NOMAD_CACERT_BASE64 | base64 -d > /tmp/nomad-ca.pem
        export NOMAD_CACERT=/tmp/nomad-ca.pem
        VERSION=$(cat VERSION) COMMIT=$(git rev-parse HEAD) envsubst <infrastructure/web-docs.nomad | nomad job run -
    version-bump:
      image: vaticle-ubuntu-20.04
      dependencies: [deploy-nomad-production]
      command: |
        export GIT_USERNAME=$REPO_GITHUB_USERNAME
        export GIT_EMAIL=$REPO_GITHUB_EMAIL
        bazel run @vaticle_dependencies//tool/release/version:bump
