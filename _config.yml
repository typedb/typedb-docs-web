
output: web
# this property is useful for conditional filtering of content that is separate from the PDF.

topnav_title: GRAKN.AI
# this appears on the top navigation bar next to the home button

title: GRAKN.AI
# this appears in the html browser tab for the site title (seen mostly by search engines, not users)

company_name: GRAKN.AI
# this appears in the footer

github_editme_path: https://github.com/graknlabs/docs/blob/development/
# if you're using Github, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.

google_analytics: UA-72414051-1

# disqus_shortname: idrbwjekyll
# if you're using disqus for comments, add the shortname here. if not, leave this value blank.

host: 127.0.0.1
# the preview server used. Leave as is.

port: 4005
# the port where the preview is rendered. You can leave this as is unless you have other Jekyll builds using this same port that might cause conflicts. in that case, use another port such as 4006.

sass:
  sass_dir: css

plugins:
  - jekyll-coffeescript
  - jekyll-toc

toc:
  list_class: toc
  min_level: 2
  max_level: 2

exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - config.ru
  - Procfile
  - README.md
  - static.json
  - pdfconfigs
  - pdf-template.sh
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/images/source/
  - docs/03-client-api/references/
  - docs/04-concept-api/references/
  - docs/08-examples/migration-notes
  - node_modules
  - package-lock.json
  - tests/
  - symlink_creator.sh
  - bazel-bin/
  - bazel-docs/
  - bazel-genfiles/
  - bazel-out/
  - bazel-testlogs/

markdown: kramdown
kramdown:
 input: GFM
 auto_ids: true
 hard_wrap: false
# filter used to process markdown. note that kramdown differs from github-flavored markdown in some subtle ways

## we use prismjs for syntax highlighting
highlighter: none

collections:
  tooltips:
    output: false

defaults:
  - scope:
      path: ""
      type: "tooltips"
    values:
      layout: "page"
      comments: true
      tooltip: true
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "page"
      permalink: :path/:basename
      comments: true
      toc: true

# these are defaults used for the frontmatter for these file types

description: "A Distributed Knowledge Graph"
# the description is used in the feed.xml file

sitemap_url: http://docs.grakn.ai
