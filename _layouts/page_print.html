---
layout: default_print
comments: true
---

<div class="page-header">
    <h1 class="page-title" id="{{page.permalink | replace: '/', '' }}">{{ page.title }}</h1>
</div>

<div class="page-content">

    {% if page.summary %}
    <div class="summary">{{page.summary}}</div>
    {% endif %}
    {{ content }}
</div>
