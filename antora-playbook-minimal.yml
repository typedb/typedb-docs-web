## Minimal build playbook.
##
## Excludes the 2.x content tree, the external typedb-driver source, and the
## 3.x archive modules, so it builds only current 3.x content. Much faster than
## the full build; use for local iteration on 3.x content or the UI.
##
## The 3.x reference module is kept, so this build logs a few expected,
## non-fatal errors: the driver-API pages can't resolve their typedb-driver
## includes, and typedb-2-vs-3/process.adoc has one broken 2.x xref. The site
## still generates. Use antora-playbook.yml for a clean full build.
##
## Keep the shared settings below in sync with antora-playbook.yml.
site:
  title: TypeDB Documentation portal
  start_page: home:ROOT:index.adoc
  robots: allow
content:
  edit_url: 'https://github.com/typedb/typedb-docs/edit/development/{path}'
  sources:
    - url: .
      start_path: content/3.x/home
      branches: HEAD
    - url: .
      start_path: content/3.x/learn-typedb
      branches: HEAD
    - url: .
      start_path: content/3.x/use-cases
      branches: HEAD
    - url: .
      start_path: content/3.x/core-concepts
      branches: HEAD
    - url: .
      start_path: content/3.x/tools
      branches: HEAD
    - url: .
      start_path: content/3.x/maintenance-operation
      branches: HEAD
    - url: .
      start_path: content/3.x/reference
      branches: HEAD
    - url: .
      start_path: content/3.x/typeql-reference
      branches: HEAD
    - url: .
      start_path: content/3.x/academy
      branches: HEAD
    - url: .
      start_path: content/3.x/guides
      branches: HEAD
urls:
  latest_version_segment: ""
antora:
  extensions:
    - "@antora/lunr-extension"
asciidoc:
  attributes:
    page-pagination: "@"
    source-highlighter: ~
  extensions:
    - "@asciidoctor/tabs"
ui:
  bundle:
    url: ./ui/build/ui-bundle.zip
    snapshot: true
output:
  clean: true
  dir: ./dist
