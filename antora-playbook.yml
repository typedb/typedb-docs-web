site:
  title: TypeDB Documentation portal
  start_page: home:ROOT:overview.adoc
  robots: allow
content:
  edit_url: 'https://github.com/vaticle/typedb-docs/edit/development/{path}' 
  sources:
    - url: .
      start_path: content/drivers-src
      branches: HEAD
    - url: .
      start_path: content/typeql-src
      branches: HEAD
    - url: .
      start_path: content/manual-src
      branches: HEAD
    - url: .
      start_path: content/learn-src
      branches: HEAD
    - url: .
      start_path: content/home-src
      branches: HEAD
urls:
  latest_version_segment: ""
antora:
  extensions:
    - "@antora/lunr-extension"
asciidoc:
  attributes:
    page-pagination: "@"
    source-highlighter: ~
  extensions:
    - "@asciidoctor/tabs"
ui:
  bundle:
    url: ./ui/build/ui-bundle.zip
    snapshot: true
output:
  clean: true
  dir: ./dist
