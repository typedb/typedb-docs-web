site:
  title: TypeDB Documentation portal
  start_page: typedb:ROOT:overview.adoc
  robots: allow
  keys:
    google_analytics: G-SNVZCNLJ9R
content:
  sources:
    - url: .
      start_path: content/typedb-src
      branches: HEAD
    - url: .
      start_path: content/clients-src
      branches: HEAD
    - url: .
      start_path: content/typeql-src
      branches: HEAD
    - url: .
      start_path: content/cloud-src
      branches: HEAD
asciidoc:
  attributes:
    source-highlighter: ~
  extensions:
    - "@asciidoctor/tabs"
ui:
  bundle:
    url: ./ui/build/ui-bundle.zip
    snapshot: true
urls:
  html_extension_style: drop
output:
  clean: true
  dir: ./dist
