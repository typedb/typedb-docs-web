site:
  title: TypeDB Documentation portal
  start_page: home:ROOT:index.adoc
  robots: allow
content:
  edit_url: 'https://github.com/vaticle/typedb-docs/edit/development/{path}' 
  sources:
    - url: .
      start_path: content/drivers
      branches: HEAD
    - url: .
      start_path: content/typeql
      branches: HEAD
    - url: .
      start_path: content/manual
      branches: HEAD
    - url: .
      start_path: content/academy
      branches: HEAD
    - url: .
      start_path: content/home
      branches: HEAD
    - url: https://github.com/vaticle/typedb-driver.git
      start_path: docs
      branches: master
urls:
  latest_version_segment: ""
antora:
  extensions:
    - "@antora/lunr-extension"
asciidoc:
  attributes:
    page-pagination: "@"
    source-highlighter: ~
  extensions:
    - "@asciidoctor/tabs"
ui:
  bundle:
    url: ./ui/build/ui-bundle.zip
    snapshot: true
output:
  clean: true
  dir: ./dist
