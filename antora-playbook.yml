site:
  title: TypeDB Documentation portal
  start_page: home:ROOT:index.adoc
  robots: allow
content:
  edit_url: 'https://github.com/typedb/typedb-docs/edit/development/{path}'
  sources:
    - url: .
      start_path: content2/2.x/drivers
      branches: HEAD
    - url: .
      start_path: content2/2.x/typeql
      branches: HEAD
    - url: .
      start_path: content2/2.x/manual
      branches: HEAD
    - url: .
      start_path: content2/2.x/academy
      branches: HEAD
    - url: .
      start_path: content2/2.x/home
      branches: HEAD
    - url: https://github.com/typedb/typedb-driver.git
      start_path: docs
      branches: docs-multiversion # Following release of 3.0, this should read: ['2.x', master]
    - url: .
      start_path: content2/3.x/drivers-src
      branches: HEAD
    - url: .
      start_path: content2/3.x/typeql-src
      branches: HEAD
    - url: .
      start_path: content2/3.x/manual-src
      branches: HEAD
    - url: .
      start_path: content2/3.x/academy-src
      branches: HEAD
    - url: .
      start_path: content2/3.x/home-src
      branches: HEAD
urls:
  latest_version_segment: ""
antora:
  extensions:
    - "@antora/lunr-extension"
asciidoc:
  attributes:
    page-pagination: "@"
    source-highlighter: ~
  extensions:
    - "@asciidoctor/tabs"
ui:
  bundle:
    url: ./ui/build/ui-bundle.zip
    snapshot: true
output:
  clean: true
  dir: ./dist
